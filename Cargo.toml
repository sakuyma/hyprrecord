[package]
name = "hyprrecord"
version = "0.1.4"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
glib = "0.22.7"
gtk = { version = "0.9", package = "gtk4" }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
