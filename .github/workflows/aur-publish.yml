name: Publish to AUR

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --user root
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Install build dependencies
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm \
          base-devel \
          git \
          rust \
          cargo \
          gtk4 \
          pkg-config \
          openssl
    
    - name: Create non-root user for makepkg
      run: |
        useradd -m -G wheel builder
        echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
        chown -R builder:builder .
    
    - name: Get version
      id: get_version
      run: |
        VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f2)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    
    - name: Build binary as builder user
      run: |
        su builder -c "cargo build --release"
        strip target/release/hyprrecord
    
    - name: Prepare AUR package
      run: |
        mkdir -p aur_package
        cd aur_package
        
        cat > PKGBUILD << EOF
        # Maintainer: ${{ secrets.AUR_USERNAME }} <${{ secrets.AUR_EMAIL }}>
        
        pkgname=${{ secrets.AUR_PACKAGE_NAME }}
        pkgver=${{ steps.get_version.outputs.version }}
        pkgrel=1
        pkgdesc="Hyprland screenshot and recording utility with GUI"
        arch=('x86_64')
        url="https://github.com/${{ github.repository }}"
        license=('MIT')
        depends=('gtk4' 'slurp' 'grim' 'wf-recorder' 'wl-clipboard' 'ffmpeg')
        source=("hyprrecord")
        sha256sums=('SKIP')
        
        package() {
          install -Dm755 hyprrecord "\$pkgdir/usr/bin/hyprrecord"
        }
        EOF
        
        cp ../target/release/hyprrecord .
        chmod +x hyprrecord
        
        cd ..
        chown -R builder:builder aur_package
    
    - name: Generate .SRCINFO
      run: |
        cd aur_package
        su builder -c "/usr/bin/makepkg --printsrcinfo > .SRCINFO"
        cd ..
    
    - name: Setup SSH for AUR
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
    
    - name: Publish to AUR
      env:
        AUR_PACKAGE_NAME: ${{ secrets.AUR_PACKAGE_NAME }}
        AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
        AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
      run: |
        git clone ssh://aur@aur.archlinux.org/$AUR_PACKAGE_NAME.git aur_repo
        
        cp aur_package/PKGBUILD aur_repo/
        cp aur_package/.SRCINFO aur_repo/
        cp aur_package/hyprrecord aur_repo/
        
        cd aur_repo
        git config user.name "$AUR_USERNAME"
        git config user.email "$AUR_EMAIL"
        
        if [ -n "$(git status --porcelain)" ]; then
          git add PKGBUILD .SRCINFO hyprrecord
          git commit -m "Update to v${{ steps.get_version.outputs.version }}"
          git push origin master
          echo "✅ Successfully pushed to AUR"
        else
          echo "No changes to commit"
        fi
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: Release v${{ steps.get_version.outputs.version }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: target/release/hyprrecord
    
    - name: Save last version
      run: |
        echo "${{ steps.get_version.outputs.version }}" > .last_aur_version
