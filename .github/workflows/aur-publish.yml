name: Publish to AUR

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgtk-4-dev \
          libglib2.0-dev \
          libpango1.0-dev \
          libcairo2-dev \
          libgdk-pixbuf-2.0-dev \
          libgraphene-1.0-dev \
          pkg-config \
          libssl-dev
    
    - name: Get version
      id: get_version
      run: |
        VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f2)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    
    - name: Check if version changed
      id: check_version
      run: |
        if [ -f .last_aur_version ]; then
          LAST_VERSION=$(cat .last_aur_version)
          if [ "$LAST_VERSION" = "${{ steps.get_version.outputs.version }}" ]; then
            echo "version_changed=false" >> $GITHUB_OUTPUT
            echo "Version unchanged, skipping AUR update"
          else
            echo "version_changed=true" >> $GITHUB_OUTPUT
          fi
        else
          echo "version_changed=true" >> $GITHUB_OUTPUT
        fi
    
    - name: Build binary
      if: steps.check_version.outputs.version_changed == 'true'
      run: |
        cargo build --release
        strip target/release/hyprrecord
    
    - name: Prepare AUR package
      if: steps.check_version.outputs.version_changed == 'true'
      run: |
        mkdir -p aur_package
        cd aur_package
        
        cat > PKGBUILD << EOF
        # Maintainer: ${{ secrets.AUR_USERNAME }} <${{ secrets.AUR_EMAIL }}>
        
        pkgname=${{ secrets.AUR_PACKAGE_NAME }}
        pkgver=${{ steps.get_version.outputs.version }}
        pkgrel=1
        pkgdesc="Hyprland screenshot and recording utility with GUI"
        arch=('x86_64')
        url="https://github.com/${{ github.repository }}"
        license=('MIT')
        depends=('gtk4' 'slurp' 'grim' 'wf-recorder' 'wl-clipboard' 'ffmpeg')
        source=("hyprrecord")
        sha256sums=('SKIP')
        
        package() {
          install -Dm755 hyprrecord "\$pkgdir/usr/bin/hyprrecord"
        }
        EOF
        
        cp ../target/release/hyprrecord .
        chmod +x hyprrecord
        
        cd ..
    
    - name: Setup SSH for AUR
      if: steps.check_version.outputs.version_changed == 'true'
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts
        ssh -T aur@aur.archlinux.org || true
    
    - name: Publish to AUR
      if: steps.check_version.outputs.version_changed == 'true'
      env:
        AUR_PACKAGE_NAME: ${{ secrets.AUR_PACKAGE_NAME }}
        AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
        AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
      run: |
        if ! ssh -T aur@aur.archlinux.org 2>&1 | grep -q "successfully authenticated"; then
          echo "SSH authentication failed"
          exit 1
        fi
        
        git clone ssh://aur@aur.archlinux.org/$AUR_PACKAGE_NAME.git aur_repo || {
          echo "Failed to clone AUR repository. Make sure the package exists on AUR."
          echo "If this is the first release, create the package first:"
          echo "https://aur.archlinux.org/pkgbase/$AUR_PACKAGE_NAME/"
          exit 1
        }
        
        cp aur_package/PKGBUILD aur_repo/
        cp aur_package/hyprrecord aur_repo/
        
        cd aur_repo
        makepkg --printsrcinfo > .SRCINFO
        
        git config user.name "$AUR_USERNAME"
        git config user.email "$AUR_EMAIL"
        
        if [ -n "$(git status --porcelain)" ]; then
          git add PKGBUILD .SRCINFO hyprrecord
          git commit -m "Update to v${{ steps.get_version.outputs.version }}"
          git push origin master
          echo "Successfully pushed to AUR"
        else
          echo "No changes to commit"
        fi
    
    - name: Create Release
      if: steps.check_version.outputs.version_changed == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: Release v${{ steps.get_version.outputs.version }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: target/release/hyprrecord
    
    - name: Save last version
      if: steps.check_version.outputs.version_changed == 'true'
      run: |
        echo "${{ steps.get_version.outputs.version }}" > .last_aur_version
