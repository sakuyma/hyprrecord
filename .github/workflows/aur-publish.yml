name: Publish to AUR

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgtk-4-dev \
          libglib2.0-dev \
          libpango1.0-dev \
          libcairo2-dev \
          libgdk-pixbuf-2.0-dev \
          libgraphene-1.0-dev \
          libxkbcommon-dev \
          libwayland-dev \
          pkg-config \
          libssl-dev \
          liblzma-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev
    
    - name: Get version
      id: get_version
      run: |
        VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f2)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "PKGVER=$VERSION" >> $GITHUB_ENV
    
    - name: Check if version changed
      id: check_version
      run: |
        if [ -f .last_aur_version ]; then
          LAST_VERSION=$(cat .last_aur_version)
          if [ "$LAST_VERSION" = "${{ steps.get_version.outputs.version }}" ]; then
            echo "version_changed=false" >> $GITHUB_OUTPUT
            echo "Version unchanged, skipping AUR update"
          else
            echo "version_changed=true" >> $GITHUB_OUTPUT
          fi
        else
          echo "version_changed=true" >> $GITHUB_OUTPUT
        fi
    
    - name: Create Release
      if: steps.check_version.outputs.version_changed == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: Release v${{ steps.get_version.outputs.version }}
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build binary
      if: steps.check_version.outputs.version_changed == 'true'
      run: |
        cargo build --release
    
    - name: Prepare PKGBUILD for AUR
      if: steps.check_version.outputs.version_changed == 'true'
      run: |
        # Создаем PKGBUILD для бинарного пакета
        cat > PKGBUILD << 'EOF'
        # Maintainer: Your Name <your-email@example.com>
        
        pkgname=${{ secrets.AUR_PACKAGE_NAME }}
        pkgver=${{ steps.get_version.outputs.version }}
        pkgrel=1
        pkgdesc="Hyprland screenshot and recording utility with GUI"
        arch=('x86_64')
        url="https://github.com/${{ github.repository }}"
        license=('MIT')
        depends=(
          'gtk4'
          'slurp'
          'grim'
          'wf-recorder'
          'wl-clipboard'
          'ffmpeg'
          'ffprobe'
        )
        makedepends=('cargo')
        source=("hyprrecord")
        sha256sums=('SKIP')
        
        package() {
          install -Dm755 hyprrecord "$pkgdir/usr/bin/hyprrecord"
        }
        EOF
    
    - name: Copy binary to package directory
      if: steps.check_version.outputs.version_changed == 'true'
      run: |
        cp target/release/hyprrecord .
        chmod +x hyprrecord
    
    - name: Generate .SRCINFO
      if: steps.check_version.outputs.version_changed == 'true'
      run: |
        cat > .SRCINFO << EOF
        pkgbase = ${{ secrets.AUR_PACKAGE_NAME }}
        pkgname = ${{ secrets.AUR_PACKAGE_NAME }}
        pkgver = ${{ steps.get_version.outputs.version }}
        pkgrel = 1
        url = https://github.com/${{ github.repository }}
        license = MIT
        depends = gtk4
        depends = slurp
        depends = grim
        depends = wf-recorder
        depends = wl-clipboard
        depends = ffmpeg
        depends = ffprobe
        source = hyprrecord
        sha256sums = SKIP
        EOF
    
    - name: Prepare AUR package
      if: steps.check_version.outputs.version_changed == 'true'
      run: |
        mkdir -p aur_package
        cp PKGBUILD .SRCINFO hyprrecord aur_package/
    
    - name: Publish to AUR
      if: steps.check_version.outputs.version_changed == 'true'
      uses: KSXGitHub/github-actions-deploy-aur@v3
      with:
        pkgname: ${{ secrets.AUR_PACKAGE_NAME }}
        pkgbuild: ./PKGBUILD
        commit_username: ${{ secrets.AUR_USERNAME }}
        commit_email: ${{ secrets.AUR_EMAIL }}
        ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        commit_message: "Update to v${{ steps.get_version.outputs.version }}"
        force_push: "true"
    
    - name: Save last version
      if: steps.check_version.outputs.version_changed == 'true'
      run: |
        echo "${{ steps.get_version.outputs.version }}" > .last_aur_version
    
    - name: Upload artifact
      if: steps.check_version.outputs.version_changed == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: hyprrecord-binary
        path: target/release/hyprrecord
